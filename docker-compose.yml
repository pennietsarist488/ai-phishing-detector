# AI钓鱼网站检测系统 - Docker Compose 配置
# ============================================
# 
# 使用方式:
#   构建并启动服务:
#     docker-compose up -d --build
#   
#   查看服务状态:
#     docker-compose ps
#   
#   查看日志:
#     docker-compose logs -f backend
#   
#   停止服务:
#     docker-compose down
#   
#   模型热更新（无需重启容器）:
#     curl -X POST http://localhost:5000/api/model/reload
#
# 注意事项:
#   - models 目录已挂载，支持热更新模型文件
#   - 生产环境请修改 SECRET_KEY 环境变量
#   - 健康检查每 30 秒执行一次

version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishing-detector
    ports:
      - "5000:5000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=5000
      - DEBUG=false
      - MODEL_DIR=/app/models
    volumes:
      # 挂载模型目录，支持热更新
      - ./models:/app/models
      # 挂载日志目录
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 可选: 生产环境使用nginx反向代理
  # nginx:
